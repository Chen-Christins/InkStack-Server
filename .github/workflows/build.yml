name: Build & Package

# 触发：
#   - 手动 workflow_dispatch（可选 dev/prod，出 Actions artifact）
#   - 打 tag v* → 额外发布到 GitHub Release
on:
  workflow_dispatch:
    inputs:
      env:
        description: 打包环境
        type: choice
        default: prod
        options: [prod, dev]
  push:
    branches:
      - master
      - feature/*
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PKG_ENV: ${{ github.event.inputs.env || 'prod' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            rsync \
            python3 \
            gettext \
            libboost-context-dev \
            libtool \
            gcc \
            g++ \
            autoconf \
            automake \
            cmake \
            libboost-all-dev \
            libsqlite3-dev \
            libssl-dev \
            libevent-dev \
            libmysqlclient-dev \
            ccache \
            redis \
            libnghttp2-dev \
            git \
            wget \
            unzip \
            zip

      - name: Fetch chen-sdk + thirdparty deps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deps.py sync

      - name: Apply SDK (bin / tools / protocol / resources)
        run: make apply

      - name: Generate ORM data
        run: make orm

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.arch }}-${{ hashFiles('src/**') }}
          restore-keys: ccache-${{ matrix.arch }}-

      - name: Configure (Release, Ninja)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Prepare prod.env (from GitHub Secrets)
        if: env.PKG_ENV == 'prod'
        env:
          WORK_PATH: ${{ vars.WORK_PATH }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWD: ${{ secrets.MYSQL_PASSWD }}
          MYSQL_DBNAME: ${{ secrets.MYSQL_DBNAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_DBNAME: ${{ secrets.REDIS_DBNAME }}
          ADMIN_PASSWD: ${{ secrets.ADMIN_PASSWD }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GITHUB_CALLBACK_URL: ${{ secrets.OAUTH_GITHUB_CALLBACK_URL }}
          FRONTEND_BASE: ${{ vars.FRONTEND_BASE }}
          AUTH_COOKIE_SECURE: "true"
          WEBAUTHN_RP_ID: ${{ vars.WEBAUTHN_RP_ID }}
          WEBAUTHN_RP_NAME: ${{ vars.WEBAUTHN_RP_NAME }}
          WEBAUTHN_ORIGIN: ${{ vars.WEBAUTHN_ORIGIN }}
          WEBAUTHN_USER_HANDLE_SECRET: ${{ secrets.WEBAUTHN_USER_HANDLE_SECRET }}
        run: |
          {
            echo "WORK_PATH=${WORK_PATH:-/home/path/to/apps}"
            echo "LOG_LEVEL=${LOG_LEVEL:-info}"
            echo "MYSQL_HOST=${MYSQL_HOST:-change.me}"
            echo "MYSQL_PORT=${MYSQL_PORT:-3306}"
            echo "MYSQL_USER=${MYSQL_USER:-change.me}"
            echo "MYSQL_PASSWD=${MYSQL_PASSWD:-change.me}"
            echo "MYSQL_DBNAME=${MYSQL_DBNAME:-techhaven}"
            echo "REDIS_HOST=${REDIS_HOST:-127.0.0.1:6379}"
            echo "REDIS_DBNAME=${REDIS_DBNAME:-blog}"
            echo "ADMIN_PASSWD=${ADMIN_PASSWD:-}"
            echo "GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}"
            echo "GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}"
            echo "GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL}"
            echo "FRONTEND_BASE=${FRONTEND_BASE}"
            echo "AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}"
            echo "WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-change.me}"
            echo "WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-InkStack}"
            echo "WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-https://change.me}"
            echo "WEBAUTHN_USER_HANDLE_SECRET=${WEBAUTHN_USER_HANDLE_SECRET:-}"
          } > bin/conf/prod.env

      - name: Package
        run: ./collect.sh "${PKG_ENV}"

      - name: Rename package (tag + arch)
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          mv techhaven-server-*.tar.gz "techhaven-server-${tag}-${{ matrix.arch }}.tar.gz"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: techhaven-server-${{ matrix.arch }}
          path: techhaven-server-*.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog for this version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v prefix="## v${VER}" '
            index($0, prefix) == 1 && (length($0) == length(prefix) || substr($0, length(prefix) + 1, 1) == " ") { found=1; next }
            found && /^## v/ { exit }
            found
          ' CHANGELOG.md > /tmp/release_body.md

          if [ ! -s /tmp/release_body.md ]; then
            printf 'Release %s\n' "${GITHUB_REF_NAME}" > /tmp/release_body.md
          fi

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file /tmp/release_body.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes-file /tmp/release_body.md
          fi

          gh release upload "${GITHUB_REF_NAME}" artifacts/*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" --clobber
